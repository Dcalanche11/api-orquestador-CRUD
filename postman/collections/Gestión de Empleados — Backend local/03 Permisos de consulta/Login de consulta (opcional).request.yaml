$kind: http-request
description: Enviar usuario/contraseña de la CLI como formulario. Guarda automáticamente el token; no se necesita client_id/client_secret.
url: "{{base_url}}/api/v1/auth/token"
method: POST
body:
  type: urlencoded
  content:
    username: "{{viewer_username}}"
    password: "{{viewer_password}}"
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.unset("viewer_access_token");
      if (!pm.environment.get("viewer_username") || !pm.environment.get("viewer_password")) {
          pm.execution.setNextRequest(null);
          pm.execution.skipRequest();
          throw new Error("Complete viewer_username y viewer_password en el environment activo.");
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
          const data = pm.response.json();
          pm.test("JWT recibido", () => {
              pm.expect(data.token_type).to.eql("bearer");
              pm.expect(data.access_token).to.be.a("string").and.not.empty;
          });
          pm.environment.set("viewer_access_token", data.access_token);
      } else {
          pm.environment.unset("viewer_access_token");
          pm.execution.setNextRequest(null);
      }
    language: text/javascript
order: 1000
