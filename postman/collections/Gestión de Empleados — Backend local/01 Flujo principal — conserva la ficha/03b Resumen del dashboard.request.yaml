$kind: http-request
description: Resumen global de PDGE. Incluye todos los empleados; salarios separados por moneda y frecuencia de pago. Requiere iniciar sesión.
url: "{{base_url}}/api/v1/employees/summary"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Resumen válido", () => {
        const data = pm.response.json();
        pm.expect(data.total).to.be.at.least(0);
        pm.expect(data.igss_count).to.be.at.most(data.total);
        pm.expect(data.irtra_count).to.be.at.most(data.total);
        pm.expect(data.genders.reduce((total, group) => total + group.count, 0)).to.eql(data.total);
        pm.expect(data.salaries.reduce((total, group) => total + group.employee_count, 0)).to.eql(data.total);
      });
    language: text/javascript
order: 3500
