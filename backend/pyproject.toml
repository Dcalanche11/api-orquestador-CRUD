[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-api"
version = "0.1.0"
description = "API de gestión de empleados con arquitectura limpia"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1", "slowapi>=0.1.9,<1", "redis>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
employee-admin = "employee_api.infrastructure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --cov=employee_api --cov-report=term-missing --cov-report=xml --cov-fail-under=81"
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.coverage.run]
omit = ["*/infrastructure/cli.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
